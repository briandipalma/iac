[[repo]]
name = "iac"
tags = ["Syncable"]
[repo.config]
git_account = "briandipalma"
repo = "briandipalma/iac"

##

[[action]]
name = "pi-hole-one"
tags = ["Syncable"]
[action.config]
## Run every night at 2 AM.
## Scheduled an hour ahead of the backup action so the fresh archive
## is on disk by the time that night's backup picks it up.
schedule_format = "Cron"
schedule = "0 0 2 * * *"
file_contents = """
let zip;

// Remove the previous archive(s) first so only the newest one is kept.
// /etc/pihole inside the container is /mnt/storage/appdata/pihole on the host,
// which is the directory backup.sh syncs to the b2_backups remote.
await komodo.execute_container_exec(
  {
    server: "PVE",
    container: "pihole",
    command: 'rm -f /etc/pihole/*.zip',
    shell: "bash",
    terminal: "name",
    recreate: Types.TerminalRecreateMode.Always,
  },
  {
    onLine: (line) => {console.log(line)},
  }
);

await komodo.execute_container_exec(
  {
    server: "PVE",
    container: "pihole",
    command: 'pihole-FTL --teleporter',
    shell: "bash",
    terminal: "name",
    recreate: Types.TerminalRecreateMode.Always,
  },
  {
    // The teleporter prints the path of the archive it created, so grab it from the output.
    onLine: (line) => {if(line.trim().endsWith(".zip")){zip = line.trim()}},
  }
);

if (zip) {
  await komodo.execute_container_exec(
    {
      server: "PVE",
      container: "pihole",
      command: `mv "${zip}" /etc/pihole/`,
      shell: "bash",
      terminal: "name",
      recreate: Types.TerminalRecreateMode.Always,
    },
    {
      onLine: (line) => {console.log(line)},
    }
  );
} else {
  console.error("Failed to find the path of the pihole teleporter archive.");
}
"""

##

[[action]]
name = "backup-pve"
tags = ["Syncable"]
[action.config]
## Run every night at 3 AM.
## Uses the Core timezone (TZ in komodo/servers/pve/compose.env).
## CRON fields: (second, minute, hour, day of month, month, day of week).
schedule_format = "Cron"
schedule = "0 0 3 * * *"
file_contents = """
await komodo.execute_server_action({
  server: "PVE",
}, {
  shell: "sh",
  script: "/home/data/iac/ubuntu-docker/backup.sh",
  onLine: (line) => {console.log(line)},
  });
"""

