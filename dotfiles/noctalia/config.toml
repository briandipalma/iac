[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    center = []
    end = [ "notifications", "media", "tray", "network", "bluetooth", "volume", "brightness", "battery", "clock" ]
    margin_ends = 0
    radius = 0
    scale = 1.4500000141561031
    start = [ "control-center", "taskbar" ]

[hooks]
started = ""

[location]
address = "Dublin, Ireland"

[nightlight]
enabled = true

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

[shell]
polkit_agent = true

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.clock]
format = "{:%F %R}"

[widget.media]
hide_when_no_media = true

[widget.network]
vpn_status = "both"

[widget.notifications]
scale = 1.0

[widget.taskbar]
anchor = true
group_by_workspace = true
icon_scale = 1.0
inactive_opacity = 0.65000000000000002
only_active_workspace = false
workspace_group_capsule = true

[widget.workspaces]
label_source = "name"
max_label_chars = 8
